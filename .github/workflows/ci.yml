name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generated clients are current
        run: node scripts/generate.mjs --check
      - name: Versions match
        run: |
          n=$(node -p "require('./node/package.json').version")
          p=$(grep -m1 '^version' python/pyproject.toml | cut -d'"' -f2)
          test "$n" = "$p"
          grep -q "VERSION = \"$n\"" node/src/client.ts
          grep -q "VERSION = \"$n\"" python/clickruntime_cli/client.py
      - name: Build Node CLI
        run: cd node && npm ci && npm run build
      - name: Conformance (Node and Python)
        run: node conformance/run.mjs all
